<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Email Portal | MTNSPEC</title>
    <meta name="description" content="Access your MTNSPEC company email.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .email-portal {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }

        .portal-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .portal-container .logo {
            width: 80px;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 15px rgba(0, 200, 150, 0.3));
        }

        .portal-container h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .portal-container .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 35px;
        }

        .email-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            background: linear-gradient(135deg, #00c896, #00a87a);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 200, 150, 0.3);
            margin-bottom: 30px;
        }

        .email-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 200, 150, 0.4);
        }

        .email-btn i {
            font-size: 1.3rem;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .instructions h3 {
            color: #00c896;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .instructions ol {
            color: rgba(255, 255, 255, 0.7);
            padding-left: 20px;
            margin: 0;
            line-height: 1.8;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin-top: 25px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #00c896;
        }

        @media (max-width: 480px) {
            .portal-container {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>
    <div class="email-portal">
        <div class="portal-container">
            <a href="index.html">
                <img src="logo.png?v=concept1" alt="MTNSPEC" class="logo">
            </a>
            <h2>Team Portal</h2>
            <p class="subtitle">Access your MTNSPEC team workspace</p>
            
            <form id="portal-form" onsubmit="handlePortalSubmit(event)">
                <div class="form-group">
                    <label for="email">Company Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@mtnspec.com" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div class="form-instructions">
                    <p><i class="fas fa-info-circle"></i> Instructions:</p>
                    <ul>
                        <li>Enter your full email (e.g. yourname@mtnspec.com)</li>
                    </ul>
                </div>

                <button type="submit" class="email-btn" style="width: 100%; justify-content: center; margin-top: 15px; border: none; cursor: pointer;">
                    <i class="fas fa-sign-in-alt"></i> Access Team Portal
                </button>
            </form>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </div>

    <script>
        function handlePortalSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Accessing Team Portal...';
                btn.disabled = true;
            }
            setTimeout(() => {
                window.location.href = 'team.html';
            }, 500);
        }
    </script>
</body>

</html>
